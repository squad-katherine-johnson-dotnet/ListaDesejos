<div class="container-formulario">

  <h2>Adicionar item à Lista de Desejos</h2>

  <form [formGroup]="formulario" (ngSubmit)="adicionarDesejo()">

    <div class="campo">
      <label for="nome">Nome do Produto:</label>

      <input type="text"
             id="nome"
             formControlName="nome" />

      <div *ngIf="formulario.get('nome')?.invalid && formulario.get('nome')?.touched"
           class="erro">
        O nome do produto é obrigatório.
      </div>
    </div>

    <div class="campo">
      <label for="prioridade">Prioridade:</label>

      <select id="prioridade"
              formControlName="prioridade">
        <option value="" disabled selected>
          Selecione uma opção
        </option>

        <option value="baixa">Baixa</option>
        <option value="media">Média</option>
        <option value="alta">Alta</option>
      </select>

      <div *ngIf="
          formulario.get('prioridade')?.invalid &&
          formulario.get('prioridade')?.touched
        "
           class="erro">
        Selecione uma prioridade.
      </div>
    </div>

    <button type="submit"
            [disabled]="formulario.invalid">
      Adicionar à lista de desejos
    </button>

  </form>

  <div class="modal-overlay" *ngIf="mostrarMensagem">
    <div class="modal">
      <h2>Lista de Desejos</h2>

      <p>{{ mensagem }}</p>

      <button type="button" (click)="mostrarMensagem = false">
        OK
      </button>
    </div>
  </div>

</div>
